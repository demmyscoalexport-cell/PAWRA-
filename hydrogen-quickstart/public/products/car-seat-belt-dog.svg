<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-label="Car Safety Belt — PAWRA">
  <defs>
    <linearGradient id="bg-car-seat-belt-dog" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F0E8"/>
      <stop offset="100%" stop-color="#EDE6DA"/>
    </linearGradient>
    <radialGradient id="glow-car-seat-belt-dog" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F5F0E8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-car-seat-belt-dog" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1B3A2D" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg-car-seat-belt-dog)"/>
  <rect width="800" height="800" fill="url(#glow-car-seat-belt-dog)"/>
  <circle cx="120" cy="120" r="80" fill="#2EE8A0" opacity="0.08"/>
  <circle cx="700" cy="680" r="100" fill="#3D405B" opacity="0.08"/>
  <g filter="url(#soft-car-seat-belt-dog)">
    
        <rect x="250" y="360" width="300" height="50" rx="12" fill="#3D405B" stroke="#1B3A2D" stroke-width="3"/>
        <circle cx="280" cy="385" r="22" fill="none" stroke="#1B3A2D" stroke-width="8"/>
        <rect x="500" y="350" width="40" height="70" rx="8" fill="#1B3A2D"/>
        <rect x="320" y="450" width="160" height="24" rx="8" fill="#1B3A2D" opacity="0.2"/>
      
  </g>
  <text x="400" y="700" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="600" fill="#1B3A2D">Car Safety Belt</text>
  <text x="400" y="770" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" letter-spacing="4" fill="#8A857C">PAWRA CARE</text>
</svg>
