<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-label="Covered Litter Box — PAWRA">
  <defs>
    <linearGradient id="bg-covered-litter-box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F0E8"/>
      <stop offset="100%" stop-color="#EDE6DA"/>
    </linearGradient>
    <radialGradient id="glow-covered-litter-box" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F5F0E8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-covered-litter-box" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1B3A2D" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg-covered-litter-box)"/>
  <rect width="800" height="800" fill="url(#glow-covered-litter-box)"/>
  <circle cx="120" cy="120" r="80" fill="#2EE8A0" opacity="0.08"/>
  <circle cx="700" cy="680" r="100" fill="#A8A29E" opacity="0.08"/>
  <g filter="url(#soft-covered-litter-box)">
    
        <path d="M240 360 L560 360 L520 540 L280 540 Z" fill="#FFFBF6" stroke="#1B3A2D" stroke-width="3"/>
        <path d="M280 280 L520 280 L560 360 L240 360 Z" fill="#A8A29E" stroke="#1B3A2D" stroke-width="3"/>
        <ellipse cx="400" cy="320" rx="50" ry="28" fill="#F5F0E8"/>
      
  </g>
  <text x="400" y="700" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="600" fill="#1B3A2D">Covered Litter Box</text>
  <text x="400" y="770" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" letter-spacing="4" fill="#8A857C">PAWRA CARE</text>
</svg>
