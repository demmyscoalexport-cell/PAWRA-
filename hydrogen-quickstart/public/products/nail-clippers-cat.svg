  <circle cx="120" cy="120" r="80" fill="#2EE8A0" opacity="0.08"/>
  <circle cx="700" cy="680" r="100" fill="#ADB5BD" opacity="0.08"/>
  <g filter="url(#soft-nail-clippers-cat)">
    
        <rect x="280" y="260" width="240" height="280" rx="20" fill="#FFFBF6" stroke="#1B3A2D" stroke-width="3"/>
        <circle cx="400" cy="380" r="50" fill="#ADB5BD"/>
        <text x="400" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1B3A2D">PAWRA</text>
      
  </g>
  <text x="400" y="700" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="600" fill="#1B3A2D">Cat Nail Clippers</text>
  <text x="400" y="770" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" letter-spacing="4" fill="#8A857C">PAWRA CARE</text>
