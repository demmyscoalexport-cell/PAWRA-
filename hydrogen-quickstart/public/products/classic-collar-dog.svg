    </radialGradient>
    <filter id="soft-classic-collar-dog" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1B3A2D" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg-classic-collar-dog)"/>
