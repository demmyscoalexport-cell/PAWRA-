        <path d="M240 400 Q400 300 560 400 Q400 500 240 400" fill="none" stroke="#3D405B" stroke-width="26"/>
        <path d="M240 400 Q400 300 560 400 Q400 500 240 400" fill="none" stroke="#1B3A2D" stroke-width="4"/>
        <rect x="370" y="450" width="60" height="40" rx="6" fill="#1B3A2D"/>
