<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-label="Paw &amp; Nose Balm — PAWRA">
  <defs>
    <linearGradient id="bg-paw-balm-dog" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F0E8"/>
      <stop offset="100%" stop-color="#EDE6DA"/>
    </linearGradient>
    <radialGradient id="glow-paw-balm-dog" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F5F0E8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-paw-balm-dog" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1B3A2D" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg-paw-balm-dog)"/>
  <rect width="800" height="800" fill="url(#glow-paw-balm-dog)"/>
  <circle cx="120" cy="120" r="80" fill="#2EE8A0" opacity="0.08"/>
  <circle cx="700" cy="680" r="100" fill="#C9A227" opacity="0.08"/>
  <g filter="url(#soft-paw-balm-dog)">
    
        <ellipse cx="400" cy="460" rx="130" ry="40" fill="#8A857C" opacity="0.25"/>
        <ellipse cx="400" cy="360" rx="130" ry="40" fill="#C9A227" stroke="#1B3A2D" stroke-width="3"/>
        <rect x="270" y="360" width="260" height="100" fill="#C9A227" stroke="#1B3A2D" stroke-width="3"/>
        <ellipse cx="400" cy="460" rx="130" ry="40" fill="#FFFBF6" stroke="#1B3A2D" stroke-width="3"/>
        <text x="400" y="420" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#1B3A2D">PAWRA</text>
      
  </g>
  <text x="400" y="700" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="600" fill="#1B3A2D">Paw &amp; Nose Balm</text>
  <text x="400" y="770" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" letter-spacing="4" fill="#8A857C">PAWRA CARE</text>
</svg>
