  <circle cx="700" cy="680" r="100" fill="#6D6875" opacity="0.08"/>
  <g filter="url(#soft-donut-cuddler-bed)">
    
        <ellipse cx="400" cy="420" rx="170" ry="150" fill="#6D6875" stroke="#1B3A2D" stroke-width="3"/>
        <ellipse cx="400" cy="430" rx="70" ry="55" fill="#F5F0E8"/>
        <ellipse cx="400" cy="410" rx="150" ry="40" fill="#FFFBF6" opacity="0.35"/>
      
  </g>
  <text x="400" y="700" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="600" fill="#1B3A2D">Donut Cuddler</text>
  <text x="400" y="770" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" letter-spacing="4" fill="#8A857C">PAWRA CARE</text>
