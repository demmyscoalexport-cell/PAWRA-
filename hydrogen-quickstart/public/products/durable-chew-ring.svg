  <circle cx="700" cy="680" r="100" fill="#2A9D8F" opacity="0.08"/>
  <g filter="url(#soft-durable-chew-ring)">
    
        <circle cx="400" cy="400" r="130" fill="none" stroke="#2A9D8F" stroke-width="48"/>
        <circle cx="400" cy="400" r="130" fill="none" stroke="#1B3A2D" stroke-width="4"/>
        <circle cx="400" cy="400" r="82" fill="none" stroke="#1B3A2D" stroke-width="4"/>
        <circle cx="400" cy="400" r="28" fill="#2EE8A0"/>
      
  </g>
  <text x="400" y="700" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="600" fill="#1B3A2D">Durable Chew Ring</text>
  <text x="400" y="770" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" letter-spacing="4" fill="#8A857C">PAWRA CARE</text>
